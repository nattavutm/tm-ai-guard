<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local LLM Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f11;
    color: #e8e8e8;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Header ── */
  #header {
    width: 100%;
    max-width: 800px;
    padding: 16px 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
  }
  #status-dot.online { background: #22c55e; }
  #status-dot.error  { background: #ef4444; }

  #model-label {
    font-size: 14px;
    font-weight: 600;
    color: #aaa;
  }

  #lm-url-input {
    background: #1c1c1e;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 12px;
    padding: 5px 10px;
    width: 200px;
    outline: none;
    margin-left: auto;
  }
  #lm-url-input:focus { border-color: #555; }

  /* ── Mode toggle ── */
  #mode-bar {
    width: 100%;
    max-width: 800px;
    padding: 12px 20px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #mode-toggle {
    display: flex;
    background: #1c1c1e;
    border: 1px solid #2a2a2e;
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .mode-btn {
    padding: 6px 16px;
    border-radius: 7px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    background: none;
    color: #666;
  }
  .mode-btn.active {
    background: #2a2a2e;
    color: #e8e8e8;
  }
  .mode-btn.active.guard-mode {
    background: #1a3a2a;
    color: #4ade80;
  }

  /* ── AI Guard config panel ── */
  #guard-panel {
    width: 100%;
    max-width: 800px;
    padding: 12px 20px 0;
    display: none;
  }
  #guard-panel.visible { display: block; }

  .guard-config {
    background: #111a14;
    border: 1px solid #1e3a28;
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .guard-config label {
    font-size: 11px;
    color: #4ade80;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 4px;
  }

  .guard-config input,
  .guard-config select {
    width: 100%;
    background: #0f1a12;
    border: 1px solid #1e3a28;
    border-radius: 7px;
    color: #e8e8e8;
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    font-family: inherit;
  }
  .guard-config input:focus,
  .guard-config select:focus { border-color: #4ade80; }

  .guard-config .full-width { grid-column: 1 / -1; }

  .guard-config select option { background: #111a14; }

  /* ── Guard result badge ── */
  .guard-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    margin-bottom: 6px;
  }
  .guard-badge.allow {
    background: #0d2e1a;
    color: #4ade80;
    border: 1px solid #1e4a2a;
  }
  .guard-badge.block {
    background: #2e0d0d;
    color: #f87171;
    border: 1px solid #4a1e1e;
  }

  .blocked-bubble {
    background: #1a0f0f !important;
    border-color: #3a1e1e !important;
  }

  /* ── Messages ── */
  #messages {
    flex: 1;
    width: 100%;
    max-width: 800px;
    overflow-y: auto;
    padding: 16px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }

  .msg {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    margin-top: 2px;
  }
  .msg.user .avatar      { background: #3b5bdb; }
  .msg.assistant .avatar { background: #1c1c1e; border: 1px solid #333; }

  .bubble-wrap { display: flex; flex-direction: column; max-width: 75%; }
  .msg.user .bubble-wrap { align-items: flex-end; }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: #3b5bdb;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: #1c1c1e;
    border: 1px solid #2a2a2e;
    border-bottom-left-radius: 4px;
    color: #e0e0e0;
  }

  /* ── Typing dots ── */
  .typing-dots span {
    display: inline-block;
    width: 6px; height: 6px;
    background: #666;
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* ── Input area ── */
  #input-area {
    width: 100%;
    max-width: 800px;
    padding: 12px 20px 24px;
  }

  #form {
    display: flex;
    gap: 8px;
    background: #1c1c1e;
    border: 1px solid #2a2a2e;
    border-radius: 14px;
    padding: 8px 8px 8px 14px;
    align-items: flex-end;
    transition: border-color 0.2s;
  }
  #form:focus-within { border-color: #3b5bdb; }
  #form.guard-active:focus-within { border-color: #4ade80; }

  #prompt {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #e8e8e8;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 160px;
    min-height: 24px;
    font-family: inherit;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  #prompt::placeholder { color: #555; }

  #send-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: none;
    background: #3b5bdb;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, opacity 0.2s;
  }
  #send-btn:hover    { background: #4c6ef5; }
  #send-btn:disabled { background: #2a2a2e; opacity: 0.5; cursor: not-allowed; }
  #send-btn.guard-active { background: #16a34a; }
  #send-btn.guard-active:hover { background: #15803d; }
  #send-btn svg { width: 16px; height: 16px; }

  .hint {
    font-size: 11px;
    color: #444;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="status-dot"></div>
  <span id="model-label">Local LLM</span>
  <input id="lm-url-input" type="text" value="http://192.168.1.51:8080" placeholder="LM Studio URL" />
</div>

<!-- Mode toggle -->
<div id="mode-bar">
  <div id="mode-toggle">
    <button class="mode-btn active" id="btn-direct" onclick="setMode('direct')">Direct</button>
    <button class="mode-btn" id="btn-guard" onclick="setMode('guard')">AI Guard</button>
  </div>
</div>

<!-- AI Guard config panel -->
<div id="guard-panel">
  <div class="guard-config">
    <div>
      <label>Region</label>
      <select id="guard-region">
        <option value="us" selected>US (default)</option>
        <option value="eu">EU</option>
        <option value="jp">JP</option>
        <option value="au">AU</option>
        <option value="in">IN</option>
        <option value="sg">SG</option>
        <option value="mea">MEA</option>
      </select>
    </div>
    <div>
      <label>Application Name</label>
      <input id="guard-appname" type="text" value="Bank-AI-Guard" placeholder="App name (letters/numbers/-/_)" />
    </div>
    <div class="full-width">
      <label>API Key</label>
      <input id="guard-apikey" type="password"
        value="eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJjaWQiOiI4MjU4MzgwYy03ZGFiLTRhNTAtODJmYS0yYzEwZjUwOTc5YmEiLCJjcGlkIjoic3ZwIiwicHBpZCI6ImN1cyIsIml0IjoxNzc5ODU1NTY5LCJldCI6MTc4MjQ0NzU2OCwiaWQiOiI3Y2ZiZDQwMy02ZDQzLTQyN2YtYWY0OC0yNjVmOWI1ZDlhNjQiLCJ0b2tlblVzZSI6ImN1c3RvbWVyIn0.IlCpvL7Q0RlSJVsN4R7jD50nCESAkcbtS8YQsWWubDN3jgOTLICWrTXjJbIpb7bG0fj1wL5S3Qs-S3YjsGjCoEzbROg4KK154z4sMVn3MLALoXwTSpcmtAj3xQ1jusJNr9zFmz3P7OwKE_AF7aEvoEsKQa6Up1oE70Ko1dZ2cNHAqEnr1qUbcxIDCFsAHziVHmZXooOnhow9ou_k4ZeZL9kZKqu43bUGV5OkGkBFDLwbGoqweoB_WUFINNA7BQaCQG3kKfhEpla4kBjcZ66H8Fc0t_f15pscuZYLxNvgq_Q5VN-y16iR6nJWzS9L1cSCB3T2VflUEEkn79BaZdRUkv16rkGStUirarcI6kGQzbdGfGcgVqDKKPNBqTg2tf-s19LoXLQFZE4auygdEK5N1mhP20GoxlS_YBBf8i0UnxtsnOJp9yZOh3kUflOP1rSpBhOgLtByXdXeqDsh1Gd4tDhg48fnQ5KHIlGQKAOUltZO12AExaVUtjkGNX7taTv88WRSPRqh2QfjT1kz7zTc7QhY0ysPliut_5nzY27cyegpn4T8M8KbnJgfmIt1zpaMi0-kj0sKm9kP9JzPFHsgRwOfV50SCm23OJ0C_SF7Pt8sOYCfBl2DIZOgKtGpZ3bcxxdPdewUIU9BoHRPDBrLP4Xa4MOTm9oITZUs6GsKO5Y"
        placeholder="Bearer token" />
    </div>
  </div>
</div>

<!-- Messages -->
<div id="messages"></div>

<!-- Input -->
<div id="input-area">
  <div id="form">
    <textarea id="prompt" rows="1" placeholder="ส่งข้อความ…"></textarea>
    <button id="send-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <p class="hint">Enter ส่ง &middot; Shift+Enter ขึ้นบรรทัดใหม่</p>
</div>

<script>
  const messagesEl  = document.getElementById('messages');
  const promptEl    = document.getElementById('prompt');
  const sendBtn     = document.getElementById('send-btn');
  const lmUrlInput  = document.getElementById('lm-url-input');
  const statusDot   = document.getElementById('status-dot');
  const modelLabel  = document.getElementById('model-label');
  const formEl      = document.getElementById('form');

  const history = [];
  let isStreaming = false;
  let currentModel = '';
  let mode = 'direct'; // 'direct' | 'guard'

  // ── Mode toggle ──────────────────────────────
  function setMode(m) {
    mode = m;
    document.getElementById('btn-direct').classList.toggle('active', m === 'direct');
    document.getElementById('btn-guard').classList.toggle('active', m === 'guard');
    document.getElementById('btn-guard').classList.toggle('guard-mode', m === 'guard');
    document.getElementById('guard-panel').classList.toggle('visible', m === 'guard');
    formEl.classList.toggle('guard-active', m === 'guard');
    sendBtn.classList.toggle('guard-active', m === 'guard');
    promptEl.placeholder = m === 'guard' ? 'ส่งข้อความ… (จะผ่าน AI Guard ก่อน)' : 'ส่งข้อความ…';
  }

  // ── Textarea auto-resize ─────────────────────
  promptEl.addEventListener('input', () => {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
  });

  promptEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!isStreaming) send();
    }
  });

  sendBtn.addEventListener('click', () => { if (!isStreaming) send(); });

  // ── Ping LM Studio ───────────────────────────
  async function ping() {
    try {
      const base = lmUrlInput.value.replace(/\/$/, '');
      const res = await fetch(`${base}/v1/models`);
      const data = await res.json();
      currentModel = data.data?.[0]?.id ?? '';
      modelLabel.textContent = currentModel || 'local model';
      statusDot.className = 'online';
    } catch {
      statusDot.className = 'error';
      modelLabel.textContent = 'ไม่พบเซิร์ฟเวอร์';
      currentModel = '';
    }
  }

  ping();
  lmUrlInput.addEventListener('change', ping);

  // ── DOM helpers ──────────────────────────────
  function addMessage(role, content, extra = {}) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '✦';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    if (extra.badge) {
      const badge = document.createElement('div');
      badge.className = `guard-badge ${extra.badge}`;
      badge.innerHTML = extra.badge === 'allow'
        ? '&#10003; AI Guard: Allowed'
        : '&#10005; AI Guard: Blocked';
      wrap.appendChild(badge);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (extra.blocked ? ' blocked-bubble' : '');
    bubble.textContent = content;

    wrap.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(wrap);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    const msg = document.createElement('div');
    msg.className = 'msg assistant';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '✦';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const bubble = document.createElement('div');
    bubble.className = 'bubble typing-dots';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    wrap.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(wrap);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  // ── AI Guard check (via local proxy to avoid CORS) ──
  async function checkGuard(promptText) {
    const region  = document.getElementById('guard-region').value;
    const appName = document.getElementById('guard-appname').value.trim();
    const apiKey  = document.getElementById('guard-apikey').value.trim();

    const res = await fetch('http://localhost:3000/proxy/guard', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Guard-Key': apiKey,
        'X-Guard-Region': region,
        'X-Guard-AppName': appName,
      },
      body: JSON.stringify({ prompt: promptText }),
    });

    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try {
        const errJson = await res.json();
        detail = errJson?.error?.message || errJson?.message || detail;
      } catch {}
      throw new Error(detail);
    }
    return await res.json();
  }

  // ── Main send ────────────────────────────────
  async function send() {
    const text = promptEl.value.trim();
    if (!text) return;

    promptEl.value = '';
    promptEl.style.height = 'auto';
    sendBtn.disabled = true;
    isStreaming = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    // ── AI Guard mode ──
    if (mode === 'guard') {
      const guardTyping = addTypingIndicator();
      let guardResult;
      try {
        guardResult = await checkGuard(text);
      } catch (err) {
        guardTyping.remove();
        addMessage('assistant', 'AI Guard error: ' + err.message);
        history.pop();
        sendBtn.disabled = false;
        isStreaming = false;
        promptEl.focus();
        return;
      }
      guardTyping.remove();

      const action = guardResult.action; // "Allow" | "Block"

      if (action === 'Block') {
        const reasons = guardResult.reasons?.join(', ') || 'Policy violation detected';
        addMessage('assistant', `ข้อความนี้ถูกบล็อกโดย AI Guard\n\nเหตุผล: ${reasons}`, {
          badge: 'block',
          blocked: true,
        });
        history.pop();
        sendBtn.disabled = false;
        isStreaming = false;
        promptEl.focus();
        return;
      }

      // Allowed — show badge then stream from LM Studio
      const typingEl = addTypingIndicator();
      try {
        await streamFromLM(typingEl, { guardBadge: 'allow' });
      } catch (err) {
        typingEl.remove();
        addMessage('assistant', 'LM Studio error: ' + err.message);
      }

    } else {
      // ── Direct mode ──
      const typingEl = addTypingIndicator();
      try {
        await streamFromLM(typingEl, {});
      } catch (err) {
        typingEl.remove();
        const isCors = err.message === 'Failed to fetch' || err.message.includes('NetworkError');
        const msg = isCors
          ? 'CORS Error: เปิด LM Studio → Server Settings → เปิด "Enable CORS"'
          : 'เกิดข้อผิดพลาด: ' + err.message;
        addMessage('assistant', msg);
      }
    }

    sendBtn.disabled = false;
    isStreaming = false;
    promptEl.focus();
  }

  // ── Stream from LM Studio ────────────────────
  async function streamFromLM(typingEl, opts) {
    const base = lmUrlInput.value.replace(/\/$/, '');
    const res = await fetch(`${base}/v1/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: currentModel,
        messages: history,
        stream: true,
        temperature: 0.7,
      }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    typingEl.remove();
    const bubble = addMessage('assistant', '', { badge: opts.guardBadge });
    let fullText = '';

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content ?? '';
          fullText += delta;
          bubble.textContent = fullText;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } catch {}
      }
    }

    history.push({ role: 'assistant', content: fullText });
  }

  promptEl.focus();
</script>
</body>
</html>
